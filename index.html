<!doctype html>
<html lang="vi" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" id="dynamic-favicon" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#4B2E24" />
    <meta name="application-name" content="TUNN Coffee" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TUNN Coffee" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TUNN Coffee House - Your Daily Ritual, Made Extraordinary</title>
    <meta name="description" content="TUNN Coffee House - Thương hiệu trà sữa, trà trái cây, cà phê đặc sản và matcha thủ công trong không gian tối giản ấm áp." />
    <meta name="keywords" content="TUNN Coffee House, trà sữa cao cấp, cà phê đặc sản, matcha, trà trái cây, quán cà phê đẹp" />
    <meta property="og:title" content="TUNN Coffee House - Your Daily Ritual, Made Extraordinary" />
    <meta property="og:description" content="Thương hiệu trà sữa, trà trái cây, cà phê đặc sản và matcha thủ công." />
    <meta property="og:image" content="/logo.jpg" />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap&subset=vietnamese" rel="stylesheet">
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('tunn_theme_preference');
          if (!mode) {
            var cached = localStorage.getItem('tunn_offline_storefront_v1');
            if (cached) {
              var parsed = JSON.parse(cached);
              if (parsed && parsed.settings && parsed.settings.theme_mode === 'dark') {
                mode = 'dark';
              }
            }
          }
          if (mode === 'dark') {
            var r = document.documentElement;
            r.classList.add('dark');
            r.style.setProperty('--color-primary', '#D4A574');
            r.style.setProperty('--color-bg-secondary', '#1D1511');
            r.style.setProperty('--color-bg-primary', '#140F0C');
            r.style.setProperty('--color-text-primary', '#F5EFE6');
            r.style.setProperty('--color-text-muted', '#A9988A');
            r.style.setProperty('--color-accent', '#2A201B');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-ivory-light text-coffee-dark font-sans antialiased selection:bg-coffee selection:text-ivory-light overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
